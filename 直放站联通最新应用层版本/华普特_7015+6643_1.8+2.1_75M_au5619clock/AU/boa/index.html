<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<title>DFR SYSTEM</title>
</title>
<link rel="stylesheet" type="text/css" href="easyui.css">
<script type="text/javascript" src="jquery-1.9.1.js"></script>
<script type="text/javascript" src="jquery.easyui.min.js"></script>

<script>
	var g_dev_cnt = 0;
	var g_enable_cnt = 0;
	var g_state_cnt = 0;
	var g_set_cnt = 0;
	var g_performance_cnt = 0;
	var g_cfr_cnt = 0;
	var g_custom_cnt = 0;
	function getLength(str) {
		var len = str.length;
		var reLen = 0;
		for (var i = 0; i < len; i++) {
			var tmp = str.charCodeAt(i);
			if (tmp < 27 || tmp > 126) {
				reLen += 2;
			} else {
				reLen++;
			}
		}
		return reLen;
	}
	// 显示参量列表
	function display_para() {
		var num;
		var tab_tmp;
		var str = "";
		$("#dis_id").click(function () {
			$.messager.confirm('ALARM', 'DEL CURRENT LIST AND REQUEST AGAIN?', function (r) {
				if (r) {
					g_dev_cnt = 0;
					g_enable_cnt = 0;
					g_state_cnt = 0;
					g_set_cnt = 0;
					g_performance_cnt = 0;
					g_add_cnt = 0;
					g_custom_cnt = 0;
					$("#dev_para").empty();
					$("#alarm_enable").empty();
					$("#alarm_state").empty();
					$("#set_para").empty();
					$("#performance_para").empty();
					$("#custom_para").empty();

					str = "cmd=en_list&nodata";
					$.post("cgi-bin/dru.cgi",
						str,
						function (data, status) {
							//alert("数据：" + data + "\n状态：" + status);
							if (status == "success") {
								var ss = data.split("&");
								var sm = ss[0].split("=");
								if ((sm[0] == "cmd") && (sm[1] == "en_list")) {
									for (var i = 1; i < ss.length; i++) {
										var st = ss[i].split("=");
										num = parseInt(st[0], 16);
										var type_coef = st[1].split(",");
										var vpro = (parseInt(type_coef[3]) >> 8) & 0xFF;
										if (vpro == 1) {
											tab_tmp = "dev_para";
											g_dev_cnt += 1;
											g_dev_cnt &= 1;
											tmp = g_dev_cnt;
										} else if (vpro == 2) {
											tab_tmp = "alarm_enable";
											g_enable_cnt += 1;
											g_enable_cnt &= 1;
											tmp = g_enable_cnt;
										} else if (vpro == 3) {
											tab_tmp = "alarm_state";
											g_state_cnt += 1;
											g_state_cnt &= 1;
											tmp = g_state_cnt;
										} else if (vpro == 4) {
											tab_tmp = "performance_para";
											//alert("ID：" + num.toString(16) + "\n");
											g_performance_cnt += 1;
											g_performance_cnt &= 1;
											tmp = g_performance_cnt;
										} else if (vpro == 5) {
											tab_tmp = "set_para";
											g_set_cnt += 1;
											g_set_cnt &= 1;
											tmp = g_set_cnt;
										} else {
											tab_tmp = "custom_para";
											g_custom_cnt += 1;
											g_custom_cnt &= 1;
											tmp = g_custom_cnt;
										}
										$("#" + tab_tmp).append("<b><input type='checkbox' id='cb_" + st[0] + "'></b>");
										$("#" + tab_tmp).append("<b><label style='width:500px; display:inline-block;'>" + type_coef[0] + "</label></b>");
										$("#" + tab_tmp).append("<b>：<input class='c_para' type='text' id='" + st[0] + "' var_type='" + type_coef[1] + "' coefficient='" + type_coef[2] + "'></b>");
										$("#" + tab_tmp).append("<br/>");
									}
									alert("PARAS LIST RETURN SUCCESS!");
								} else {
									alert(data);
								}
							}
						});
				}
			});
		});
	}
	// 查询全部
	function read_para() {
		var str = "";
		$("#read_id").click(function () {
			str = "";
			str += "cmd=read&nodata";
			//$(":text").each(function(){
			//	str += "&";
			//	str += $(this).attr("id");
			//	str += "=?";
			//});
			$.post("cgi-bin/dru.cgi",
				str,
				function (data, status) {
					//alert("数据：" + data + "\n状态：" + status);
					if (status == "success") {
						var ss = data.split("&");
						var sm = ss[0].split("=");
						if ((sm[0] == "cmd") && (sm[1] == "read")) {
							for (var i = 1; i < ss.length; i++) {
								var st = ss[i].split("=");
								var coeff = document.getElementById(st[0]).getAttribute("coefficient");
								var var_type = document.getElementById(st[0]).getAttribute("var_type");
								var type = var_type.indexOf("uint");
								if (type != -1) {
									$("#" + st[0]).val(parseFloat(st[1]) / parseFloat(coeff));
								} else if (var_type.indexOf("sint1") != -1) {
									var tmp = parseInt(st[1]);
									if (tmp > 0x7f) {
										tmp = 256 - tmp;
										tmp = 0 - tmp;
									}
									$("#" + st[0]).val(tmp / parseFloat(coeff));
								} else if (var_type.indexOf("sint2") != -1) {
									var tmp = parseInt(st[1]);
									if (tmp > 0x7fff) {
										tmp = 0xffff + 1 - tmp;
										tmp = 0 - tmp;
									}
									$("#" + st[0]).val(tmp / parseFloat(coeff));
								} else if (var_type.indexOf("sint4") != -1) {
									var tmp = parseInt(st[1]);
									if (tmp > 0x7fffffff) {
										tmp = 0xffffffff + 1 - tmp;
										tmp = 0 - tmp;
									}
									$("#" + st[0]).val(tmp / parseFloat(coeff));
								} else {
									$("#" + st[0]).val(st[1]);
								}
							}
							alert("QUERY ALL PARAS DONE!");
						} else {
							alert(data);
						}
					}
				});
		});
	}
	// 设置参数
	function set_para() {
		var str = "";
		var value;
		var tmp;
		$("#set_id").click(function () {
			str = "";
			str += "cmd=write";
			$(":checked").each(function () {
				str += "&";
				var st = $(this).attr("id").split("_");
				str += st[1];
				str += "=";
				value = $("#" + st[1]).val();
				var coeff = document.getElementById(st[1]).getAttribute("coefficient");
				var var_type = document.getElementById(st[1]).getAttribute("var_type");
				var type = var_type.indexOf("uint");
				if (type != -1) {
					tmp = parseFloat(value) * parseFloat(coeff);
				} else if (var_type.indexOf("sint1") != -1) {
					tmp = parseFloat(value);
					tmp = tmp * parseFloat(coeff);
					if (tmp < 0) {
						tmp = 0 - tmp;
						tmp = 0xff + 1 - tmp;
					}
				} else if (var_type.indexOf("sint2") != -1) {
					tmp = parseFloat(value);
					tmp = tmp * parseFloat(coeff);
					if (tmp < 0) {
						tmp = 0 - tmp;
						tmp = 0xffff + 1 - tmp;
					}
				} else if (var_type.indexOf("sint4") != -1) {
					tmp = parseFloat(value);
					tmp = tmp * parseFloat(coeff);
					if (tmp < 0) {
						tmp = 0 - tmp;
						tmp = 0xffffffff + 1 - tmp;
					}
				} else {
					tmp = value;
				}
				str += tmp;
			});
			$.post("cgi-bin/dru.cgi",
				str,
				function (data, status) {
					//alert("数据：" + data + "\n状态：" + status);
					if (status == "success") {
						alert("SET PARA DONE!");
					}
				});
		});
	}

	// 取消全部
	function cancel_cb() {
		$("#cancel_id").click(function () {
			$(":checked").removeAttr("checked");
		});
	}
	// 全部清空
	function clr_text() {
		$("#clr_id").click(function () {
			$.messager.confirm('ALARM', 'DEL ALL DATA CONFIRM:', function (r) {
				if (r) {
					$(":text").each(function () {
						$(this).val("");
					});
				}
			});
		});
	}
	// 单板测试
	function test() {
		$("#test_id").click(function () {
			window.location.replace("index_cn.html");
		});
	}


	$(document).ready(function () {

		// 刷新参量列表
		display_para();
		// 查询全部
		read_para();
		// 设置参数
		set_para();
		// 取消全部
		cancel_cb();
		// 全部清空
		clr_text();
		// 单板测试
		test();
	});
</script>
</head>

<body style="font-family:'宋体';">
	Welcome to the Digital Fiber Optic Repeater Station Control System AU-1.2.0
	<br>
	<br>
	<a id="dis_id" class="easyui-linkbutton">Get_Paras_list</a>
	<a id="read_id" class="easyui-linkbutton">Querry_All_Paras</a>
	<a id="set_id" class="easyui-linkbutton">CheckedParas_set</a>
	<a id="cancel_id" class="easyui-linkbutton">Uncheck_All</a>
	<a id="clr_id" class="easyui-linkbutton">All_Clean</a>
	<a id="test_id" class="easyui-linkbutton">切换中文</a>
	<div style="margin:10px 0;"></div>
	<div class="easyui-tabs" data-options="tools:'#tab-tools'" style="width:1100px;height:450px" id="tabs">
		<div title="Dev_Paras" id="dev_para" style="padding:10px">
		</div>
		<div title="ALARM_EN" id="alarm_enable" style="padding:10px">
		</div>
		<div title="ALARM_STAT" id="alarm_state" style="padding:10px">
		</div>
		<div title="STATUS_PARA" id="performance_para" style="padding:10px">
		</div>
		<div title="PARA_SETTING" id="set_para" style="padding:10px">
		</div>
		<div title="OTHER_PARAS" id="custom_para" style="padding:10px">
		</div>
	</div>
</body>

</html>
